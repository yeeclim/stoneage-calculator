name: ohrsa.net 펫 도감 자동 스크랩

on:
  schedule:
    # 매일 05:00 KST(=UTC 20:00 전날)
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-ohrsa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape ohrsa.net petinfo
        env:
          OHRSA_USERNAME: ${{ secrets.OHRSA_USERNAME }}
          OHRSA_PASSWORD: ${{ secrets.OHRSA_PASSWORD }}
        run: node scripts/scrape-ohrsa.playwright.js

      - name: Merge new pets into index.html
        id: merge
        run: |
          if node scripts/merge-auto-scrape.js | tee merge-output.txt | grep -q '^CHANGED$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          cat merge-output.txt

      - name: Commit and push
        if: steps.merge.outputs.changed == 'true'
        run: |
          git config user.name "ohrsa-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html scripts/ohrsa_pets_auto.json
          ADDED=$(grep '^추가된 펫:' merge-output.txt | sed 's/^추가된 펫: //')
          git commit -m "ohrsa.net 도감 자동 스크랩: 신규 펫 추가 (${ADDED})"
          git push
